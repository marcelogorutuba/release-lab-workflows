name: ruff

on:
  workflow_call:
    inputs:
      version:
        description: Ruff version. The rules come from the caller's config, never from the version's defaults.
        type: string
        default: 0.17.4
      working-directory:
        description: Directory with the pyproject.toml that holds [tool.ruff].
        type: string
        default: "."
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Known debt lives in the caller's per-file-ignores; anything new fails here.
      - name: ruff check
        working-directory: ${{ inputs.working-directory }}
        env:
          RUFF_VERSION: ${{ inputs.version }}
        run: pipx run "ruff==${RUFF_VERSION}" check --no-cache --output-format=github .
