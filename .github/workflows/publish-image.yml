name: Publish image

# Shared publisher. The caller runs its own tests first and calls this with `needs:`,
# so nothing is published from a red build.
#
#   pull_request        -> :pr-<n>, :sha-<short>            (amd64 only)
#   push develop        -> :develop, :develop-<short>
#   push release/X.Y    -> next RC tag (vX.Y.Z-rc.N), image :X.Y.Z-rc.N, prerelease
#   push main (merge of a release branch)
#                       -> no build: the last RC image gets :X.Y.Z and :latest, final release
#   any other push main -> nothing
#
# :latest only moves on the promotion of a tested RC.

on:
  workflow_call:
    inputs:
      image:
        description: Full image name, e.g. ghcr.io/org/service
        required: true
        type: string
      dockerfile:
        type: string
        default: ./Dockerfile
      context:
        type: string
        default: .
      build-args:
        type: string
        default: ""
      no-cache-on-release:
        description: Build release candidates from scratch
        type: boolean
        default: false
      registry:
        type: string
        default: ghcr.io

jobs:
  resolve:
    name: Resolve version and tags
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.r.outputs.mode }}
      tags: ${{ steps.r.outputs.tags }}
      version: ${{ steps.r.outputs.version }}
      release_tag: ${{ steps.r.outputs.release_tag }}
      create_release: ${{ steps.r.outputs.create_release }}
      source: ${{ steps.r.outputs.source }}
      matrix: ${{ steps.r.outputs.matrix }}
      notes_start: ${{ steps.r.outputs.notes_start }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve
        id: r
        env:
          IMAGE: ${{ inputs.image }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          git fetch --force --tags --quiet
          both='[{"platform":"linux/amd64","runner":"ubuntu-latest","arch":"amd64"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","arch":"arm64"}]'
          amd='[{"platform":"linux/amd64","runner":"ubuntu-latest","arch":"amd64"}]'
          mode=skip tags= version= release_tag= create_release=false source= matrix=$both
          short=${GITHUB_SHA:0:7}

          if [ "$EVENT" = pull_request ]; then
            # Fork PRs never get registry credentials.
            if [ "$PR_REPO" = "$GITHUB_REPOSITORY" ]; then
              mode=build matrix=$amd version="pr-$PR_NUMBER"
              tags="$IMAGE:pr-$PR_NUMBER,$IMAGE:sha-${PR_SHA:0:7}"
            fi

          elif [ "$REF" = refs/heads/develop ]; then
            mode=build version="develop-$short"
            tags="$IMAGE:develop,$IMAGE:develop-$short"

          elif [[ "$REF" == refs/heads/release/* ]]; then
            line=${REF_NAME#release/}
            [[ "$line" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::release branches must be named release/X.Y, got $REF_NAME"; exit 1; }
            existing=$(git tag --points-at HEAD --list "v$line.*-rc.*" | sort -V | tail -1)
            if [ -n "$existing" ]; then
              # Re-run on an already tagged commit: republish the same RC, no new tag.
              release_tag=$existing
            else
              last_final=$(git tag --list "v$line.*" | grep -v -- '-rc\.' | sort -V | tail -1 || true)
              if [ -n "$last_final" ]; then base="$line.$(( ${last_final##*.} + 1 ))"; else base="$line.0"; fi
              last_rc=$(git tag --list "v$base-rc.*" | sed 's/.*-rc\.//' | sort -n | tail -1)
              release_tag="v$base-rc.$(( ${last_rc:-0} + 1 ))"
              create_release=true
            fi
            mode=build version=${release_tag#v}
            tags="$IMAGE:$version"

          elif [ "$REF" = refs/heads/main ]; then
            merged=$(git rev-parse -q --verify HEAD^2 || true)
            branch=""
            if [ -n "$merged" ]; then
              # Every cut brings main in, so later release branches contain this commit too:
              # the branch whose head it is wins; containment is only the fallback.
              branch=$(git branch -r --points-at "$merged" --format='%(refname:short)' | grep '^origin/release/' || true)
              if [ -z "$branch" ]; then
                branch=$(git branch -r --contains "$merged" --format='%(refname:short)' | grep '^origin/release/' || true)
              fi
              if [ "$(printf '%s\n' "$branch" | grep -c .)" -gt 1 ]; then
                echo "::error::the merged commit belongs to more than one release branch: $(echo "$branch" | tr '\n' ' ')"; exit 1
              fi
            fi
            if [ -z "$branch" ]; then
              echo "Push on main is not a merge of a release branch: nothing to publish."
            else
              line=${branch#origin/release/}
              rc=$(git tag --list "v$line.*-rc.*" | sort -V | tail -1)
              [ -n "$rc" ] || { echo "::error::$branch was merged but has no RC tag"; exit 1; }
              if [ "$(git rev-parse "$rc^{tree}")" != "$(git rev-parse 'HEAD^{tree}')" ]; then
                echo "::error::main does not match the last tested RC ($rc). Refusing to publish."
                exit 1
              fi
              final=${rc%-rc.*}
              if git rev-parse -q --verify "refs/tags/$final" >/dev/null; then
                echo "::error::$final already exists"; exit 1
              fi
              mode=promote release_tag=$final version=${final#v} create_release=true
              source="$IMAGE:${rc#v}"
              tags="$IMAGE:${final#v},$IMAGE:latest"
            fi

          else
            echo "::error::Unsupported ref $REF"; exit 1
          fi

          notes_start=$(git tag --list 'v*' | grep -v -- '-rc' | sort -V | tail -1 || true)
          {
            echo "notes_start=$notes_start"
            echo "mode=$mode"; echo "tags=$tags"; echo "version=$version"
            echo "release_tag=$release_tag"; echo "create_release=$create_release"
            echo "source=$source"; echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "mode=$mode version=$version tags=$tags release_tag=$release_tag source=$source"

  build:
    name: Build ${{ matrix.arch }}
    needs: resolve
    if: needs.resolve.outputs.mode == 'build'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build-args }}
          labels: |
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
          provenance: mode=max
          sbom: true
          no-cache: ${{ inputs.no-cache-on-release && startsWith(github.ref, 'refs/heads/release/') }}
          outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    name: Tag image
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        env:
          TAGS: ${{ needs.resolve.outputs.tags }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -ra list <<< "$TAGS"
          for t in "${list[@]}"; do args+=(-t "$t"); done
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)
          echo "Published: $TAGS"

  promote:
    name: Promote tested RC
    needs: resolve
    if: needs.resolve.outputs.mode == 'promote'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag the RC image (no rebuild)
        env:
          TAGS: ${{ needs.resolve.outputs.tags }}
          SOURCE: ${{ needs.resolve.outputs.source }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -ra list <<< "$TAGS"
          for t in "${list[@]}"; do args+=(-t "$t"); done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            "${args[@]}" "$SOURCE"
          echo "Promoted $SOURCE to: $TAGS"
          docker buildx imagetools inspect "$SOURCE" --format '{{json .Manifest.Digest}}'

  release:
    name: GitHub Release
    needs: [resolve, merge, promote]
    if: >-
      always() && needs.resolve.outputs.create_release == 'true' &&
      (needs.merge.result == 'success' || needs.promote.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.release_tag }}
          MODE: ${{ needs.resolve.outputs.mode }}
          NOTES_START: ${{ needs.resolve.outputs.notes_start }}
        run: |
          set -euo pipefail
          if [ "$MODE" = promote ]; then kind=(--latest); else kind=(--prerelease --latest=false); fi
          start=(); [ -n "$NOTES_START" ] && start=(--notes-start-tag "$NOTES_START")
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes "${start[@]}" "${kind[@]}"
