name: golangci-lint

on:
  workflow_call:
    inputs:
      version:
        description: golangci-lint version (v2 config format).
        type: string
        default: v2.15.0
      modfile:
        description: Alternative go.mod to lint with (for example go.community.mod). Empty = go.mod.
        type: string
        default: ""
      working-directory:
        description: Directory of the Go module.
        type: string
        default: "."
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # golangci-lint fails to load packages with GOFLAGS=-modfile, so the alternative
      # modfile replaces go.mod in this throwaway checkout instead.
      - name: Use the alternative modfile
        if: inputs.modfile != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          MODFILE: ${{ inputs.modfile }}
        run: |
          cp "$MODFILE" go.mod
          cp "${MODFILE%.mod}.sum" go.sum

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      # Known debt lives in the caller's .golangci.yml exclusions; anything new fails here.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.version }}
          working-directory: ${{ inputs.working-directory }}
          problem-matchers: true
          args: --max-issues-per-linter=0 --max-same-issues=0
